<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Office layout showing a quiet desk, a group table, and a presentation area">

  <!-- Background room -->
  <rect x="0" y="0" width="800" height="500" fill="#F4F4F1"/>
  <rect x="20" y="20" width="760" height="460" fill="#FFFFFF" stroke="#E1E1DC" stroke-width="2"/>

  <!-- Floor grid lines, purely decorative -->
  <g stroke="#EDEDE8" stroke-width="1">
    <line x1="20" y1="180" x2="780" y2="180"/>
    <line x1="20" y1="340" x2="780" y2="340"/>
    <line x1="280" y1="20" x2="280" y2="480"/>
    <line x1="540" y1="20" x2="540" y2="480"/>
  </g>

  <!-- ============ ZONE 1: Quiet corner desk (top-left) ============ -->
  <g id="zone-quiet-desk">
    <rect x="50" y="50" width="200" height="140" fill="#F0F5FF" stroke="#003DA5" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
    <!-- desk -->
    <rect x="90" y="130" width="120" height="14" fill="#003DA5"/>
    <rect x="98" y="144" width="8" height="30" fill="#00265E"/>
    <rect x="194" y="144" width="8" height="30" fill="#00265E"/>
    <!-- monitor -->
    <rect x="130" y="98" width="40" height="28" fill="#111827" rx="2"/>
    <rect x="146" y="126" width="8" height="6" fill="#111827"/>
    <!-- chair -->
    <circle cx="150" cy="165" r="14" fill="#4C7FE0"/>
    <text x="150" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">Quiet Corner Desk</text>
  </g>

  <!-- ============ ZONE 2: Group table (center) ============ -->
  <g id="zone-group-table">
    <rect x="300" y="150" width="220" height="180" fill="#FFF3F3" stroke="#CE1126" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
    <!-- round table -->
    <ellipse cx="410" cy="245" rx="75" ry="45" fill="#CE1126" opacity="0.85"/>
    <!-- four chairs around it -->
    <circle cx="410" cy="180" r="12" fill="#A30D1E"/>
    <circle cx="410" cy="310" r="12" fill="#A30D1E"/>
    <circle cx="350" cy="245" r="12" fill="#A30D1E"/>
    <circle cx="470" cy="245" r="12" fill="#A30D1E"/>
    <text x="410" y="355" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">Group Table</text>
  </g>

  <!-- ============ ZONE 3: Presentation / front of room (right) ============ -->
  <g id="zone-presentation">
    <rect x="570" y="60" width="180" height="200" fill="#FFF9EF" stroke="#CE1126" stroke-width="0" rx="8"/>
    <rect x="570" y="60" width="180" height="200" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
    <!-- screen -->
    <rect x="605" y="80" width="110" height="70" fill="#111827" rx="4"/>
    <rect x="615" y="90" width="90" height="50" fill="#4C7FE0"/>
    <!-- podium -->
    <polygon points="640,175 700,175 690,220 650,220" fill="#003DA5"/>
    <!-- presenter figure, simple -->
    <circle cx="665" cy="160" r="10" fill="#CE1126"/>
    <text x="660" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">Front of the Room</text>
  </g>

  <!-- Room caption -->
  <text x="400" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#9AA3B2">Click the spot in the room where you'd naturally position yourself</text>
</svg>
