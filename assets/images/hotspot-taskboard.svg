<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Task board showing a client update card, a team huddle corner, and the team lead's desk">

  <!-- Background room -->
  <rect x="0" y="0" width="800" height="500" fill="#F4F4F1"/>
  <rect x="20" y="20" width="760" height="460" fill="#FFFFFF" stroke="#E1E1DC" stroke-width="2"/>

  <!-- Floor grid lines, purely decorative -->
  <g stroke="#EDEDE8" stroke-width="1">
    <line x1="20" y1="180" x2="780" y2="180"/>
    <line x1="20" y1="340" x2="780" y2="340"/>
    <line x1="280" y1="20" x2="280" y2="480"/>
    <line x1="540" y1="20" x2="540" y2="480"/>
  </g>

  <!-- ============ ZONE 1: Client update card (top-left) ============ -->
  <g id="zone-client-update">
    <rect x="50" y="50" width="200" height="140" fill="#FFF3F3" stroke="#CE1126" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
    <!-- kanban card -->
    <rect x="75" y="80" width="150" height="80" fill="#FFFFFF" stroke="#CE1126" stroke-width="2" rx="6"/>
    <rect x="90" y="95" width="90" height="10" fill="#CE1126" rx="2"/>
    <rect x="90" y="115" width="120" height="6" fill="#D9D9D4" rx="2"/>
    <rect x="90" y="128" width="90" height="6" fill="#D9D9D4" rx="2"/>
    <circle cx="200" cy="98" r="7" fill="#CE1126"/>
    <text x="150" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">Client Update Card</text>
  </g>

  <!-- ============ ZONE 2: Team huddle corner (center) ============ -->
  <g id="zone-team-huddle">
    <rect x="300" y="150" width="220" height="180" fill="#F0F5FF" stroke="#003DA5" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
    <!-- huddle: three small figures around a speech bubble -->
    <circle cx="380" cy="255" r="16" fill="#4C7FE0"/>
    <circle cx="440" cy="230" r="16" fill="#003DA5"/>
    <circle cx="440" cy="280" r="16" fill="#003DA5"/>
    <path d="M395 210 h60 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-35 l-12 12 v-12 h-13 a10 10 0 0 1 -10 -10 v-20 a10 10 0 0 1 10 -10 z" fill="#FFFFFF" stroke="#003DA5" stroke-width="2"/>
    <text x="410" y="355" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">Team Huddle Corner</text>
  </g>

  <!-- ============ ZONE 3: Team lead's desk (right) ============ -->
  <g id="zone-escalate-lead">
    <rect x="570" y="60" width="180" height="200" fill="#FFF9EF" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
    <!-- desk -->
    <rect x="605" y="150" width="110" height="14" fill="#111827"/>
    <rect x="613" y="164" width="8" height="30" fill="#3A3A38"/>
    <rect x="699" y="164" width="8" height="30" fill="#3A3A38"/>
    <!-- inbox tray with an escalation flag -->
    <rect x="625" y="120" width="60" height="26" fill="#4C7FE0" rx="3"/>
    <polygon points="700,90 700,130 725,110" fill="#CE1126"/>
    <line x1="700" y1="90" x2="700" y2="146" stroke="#111827" stroke-width="3"/>
    <text x="660" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111827">Team Lead's Desk</text>
  </g>

  <!-- Room caption -->
  <text x="400" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#9AA3B2">Click where you'd go first when a client update is running behind</text>
</svg>
